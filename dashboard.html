<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema Fingerprint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f2f2f2;
        }
        .btn-custom {
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 10px;
            color: #333;
        }
        .same-height {
            height: 38px;
        }
    </style>
</head>
<body class="p-4">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Dashboard</h1>
        <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
    </div>

    <div class="card">
        <div class="card-body">
            <h2 class="h5">Informe uma posição de impressão</h2>
            <div class="row g-2 align-items-center">
                <div class="col-md-2 col-sm-12 mb-2">
                    <input type="text" id="finger-name" class="form-control form-control-sm same-height" placeholder="Nome">
                </div>
                <div class="col-md-3 col-sm-12 mb-2 d-flex gap-2">
                    <button id="btn-enroll" class="btn btn-custom btn-sm same-height">Cadastrar</button>
                    <button id="btn-find" class="btn btn-primary btn-sm same-height">Buscar</button>
                </div>
            </div>
            <div id="result" class="mt-3"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5">Cadastrados</h2>
            <div id="templates-list" class="bg-light p-2 rounded"></div>
        </div>
    </div>
</div>

<script>
function showTemporaryMessage(message, duration = 5000) {
    const resultEl = document.getElementById('result');
    resultEl.innerText = message;
    setTimeout(() => {
        resultEl.innerText = "";
    }, duration);
}

async function listTemplates() {
    const res = await fetch('/templates');
    const text = await res.text();
    const linhas = text.split('<br>').filter(l => l.trim() !== '');
    const html = linhas.map(linha => {
        const [id, nome] = linha.split(':');
        return `
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span>${id}:${nome}</span>
                <button class="btn btn-sm btn-danger" onclick="deleteById(${id})">🗑️</button>
            </div>
        `;
    }).join('');
    document.getElementById('templates-list').innerHTML = html;
}

async function enroll() {
    const name = document.getElementById("finger-name").value.trim();
    if (!name) {
        showTemporaryMessage("Por favor, insira um nome válido.", 3000);
        return;
    }
    const res = await fetch('/enroll', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name})
    });
    const data = await res.json();
    if (data.success) {
        showTemporaryMessage(`Cadastrado: ID ${data.id}, Nome ${data.name}`);
        document.getElementById("finger-name").value = "";
        listTemplates();
    } else {
        showTemporaryMessage(`Erro: ${data.error}`, 5000);
    }
}

async function findfinger() {
    try {
        const res = await fetch('/find', { method: 'GET', headers: {'Content-Type': 'application/json'} });
        const data = await res.json();
        if (data.found) {
            showTemporaryMessage(`Encontrado: ID ${data.id} (Confiança: ${data.confidence})`);
        } else if (data.error) {
            showTemporaryMessage("Erro: " + data.error);
        } else {
            showTemporaryMessage("Nenhuma digital encontrada");
        }
    } catch (err) {
        showTemporaryMessage("Falha na requisição: " + err.message);
    }
}

async function deleteById(id) {
    if (!confirm(`Deseja realmente deletar o índice ${id}?`)) return;
    const res = await fetch('/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id})
    });
    const data = await res.json();
    if (data.success || data.deleted) {
        listTemplates();
    } else {
        showTemporaryMessage(`Erro ao deletar: ${JSON.stringify(data)}`, 5000);
    }
}

// Listeners
document.getElementById("btn-enroll").addEventListener("click", enroll);
document.getElementById("btn-find").addEventListener("click", findfinger);

listTemplates();
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
